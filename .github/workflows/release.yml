name: Desktop release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set the application version from the release tag
        run: |
          node --test scripts/release-version.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release version tests failed' }
          node scripts/release-version.mjs "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag' }

      - name: Install Wails and NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Wails' }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install NSIS' }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS compiler was not found' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path (go env GOPATH) 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test the application
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          npm --prefix frontend run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend checks failed' }

      - name: Build the frontend
        run: npm --prefix frontend run build

      - name: Build Windows x64 and ARM64 installers
        run: |
          wails build -platform windows/amd64,windows/arm64 -nsis -installscope user -s -ldflags "-X main.defaultOxeeURL=https://oxee.net -X main.appVersion=$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
          foreach ($arch in @('amd64', 'arm64')) {
            if (-not (Test-Path "build/bin/ShellAnywhere-$arch-setup.exe")) { throw "Missing $arch installer" }
          }

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$env:RELEASE_TAG" build/bin/ShellAnywhere-amd64-setup.exe build/bin/ShellAnywhere-arm64-setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach installers to the release' }

  unix:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin/amd64
            arch: amd64
            os: macos
          - runner: macos-15
            platform: darwin/arm64
            arch: arm64
            os: macos
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            os: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      CGO_ENABLED: '1'

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set the application version from the release tag
        run: |
          node --test scripts/release-version.test.mjs
          node scripts/release-version.mjs "$RELEASE_TAG"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils xvfb xauth dbus-x11
          echo 'BUILD_TAGS=webkit2_41' >> "$GITHUB_ENV"

      - name: Set the macOS deployment target
        if: matrix.os == 'macos'
        run: |
          echo 'CGO_CFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test the application
        run: |
          go test -tags "${BUILD_TAGS:-}" ./...
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Build the desktop app
        run: wails build -platform "$BUILD_PLATFORM" -tags "${BUILD_TAGS:-}" -s -ldflags "-X main.defaultOxeeURL=https://oxee.net -X main.appVersion=$RELEASE_TAG"

      - name: Package macOS
        if: matrix.os == 'macos'
        run: bash scripts/package-macos.sh "$BUILD_ARCH"

      - name: Check Linux desktop startup
        if: matrix.os == 'linux'
        run: |
          set +e
          xvfb-run -a dbus-run-session -- timeout 8s build/bin/ShellAnywhere
          status=$?
          set -e
          test "$status" -eq 124

      - name: Package Linux
        if: matrix.os == 'linux'
        run: |
          desktop-file-validate build/linux/shell-anywhere.desktop
          bash scripts/package-linux.sh "$BUILD_ARCH" "$RELEASE_TAG"

      - name: Attach macOS package to the release
        if: matrix.os == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "build/bin/ShellAnywhere-macos-$BUILD_ARCH.dmg" --clobber

      - name: Attach Linux packages to the release
        if: matrix.os == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "build/bin/ShellAnywhere-linux-$BUILD_ARCH.deb" "build/bin/ShellAnywhere-linux-$BUILD_ARCH.tar.gz" --clobber
